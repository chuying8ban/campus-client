android.useAndroidX=true
android.nonTransitiveRClass=true
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
# Kotlin 编译跑在**自己的** daemon 进程里，不吃 org.gradle.jvmargs 的限制 ——
# 不显式限它，它就和 Gradle daemon、测试 JVM 一起把 7.6G 内存挤爆。
# 2026-09-18 两次发布被内核 OOM killer 干掉（dmesg: Killed process (java)），
# 事后看每个 JVM 常驻 2.2~2.4G，三个叠起来就超了。
kotlin.daemon.jvmargs=-Xmx1024m
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.caching=true
kotlin.code.style=official
